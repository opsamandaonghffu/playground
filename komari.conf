# ============================================================
# Komari 探针配置文件 —— 只需要改下面两行，其余不用动
# 这个文件会被 start.sh 读取，用来生成 agent 的 config.json
# 不要把它提交到公开仓库（本仓库默认 .gitignore 已排除）
# ============================================================

# 1) 面板地址（不带结尾斜杠）——【占位符，部署前改成你自己的面板域名】
#    例如 https://komari.example.com
#    保留 https:// 前缀；如果是自签证书，把下面 IGNORE_CERT 改成 1
KOMARI_ENDPOINT=https://YOUR_PANEL_DOMAIN

# 2) Agent Token —— 在面板「添加节点 / Add Client」后复制那串 token 粘到这里
#    留空 = 不启动探针（SillyTavern 仍正常启动，方便先验证酒馆能不能用）
KOMARI_TOKEN=

# ---- 可选 ----
# 面板用自签 / 不安全证书时改成 1
IGNORE_CERT=0

# 主进程 CPU 上限（%）：防止平台因「平均 CPU 使用率过高」自动停服。
# 站内通知实测平均 37.03% 就被停，这里默认压到 25% 留足余量。
# 原理是纯 shell 的 SIGSTOP/SIGCONT 占空比节流，不需要额外装东西。
#   - 首次编译已被「预置产物」跳过，此项主要兜运行时峰值和编译回退
#   - 设 0 = 完全不限制（酒馆响应最快，但可能被平台停服）
#   - 若觉得页面偶尔发顿，可试 35；别超过平台的停服阈值
CPU_LIMIT=25

# 上报间隔（秒），默认 3
REPORT_INTERVAL=3

# 节点备注（自定义显示名，留空则用容器主机名）
NODE_NAME=
